<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EHL Power Rankings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 40px 20px 10px;
    }
    header h1 {
      font-size: 2.4rem;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    header p { color: #aaa; margin-top: 6px; }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 32px;
      margin: 30px 20px;
      max-width: 560px;
      width: 100%;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #ccc;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #eee;
    }
    .row {
      display: flex;
      gap: 16px;
      margin-bottom: 18px;
    }
    .row .field { flex: 1; }
    .row input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #eee;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
      background: #ffd700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background .2s;
    }
    button:hover { background: #e6c200; }
    .flash {
      background: #5a1a1a;
      border: 1px solid #a33;
      color: #f99;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }
    footer {
      margin-top: auto;
      padding: 20px;
      color: #555;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏒 EHL Power Rankings</h1>
    <p>Upload your schedule CSV to generate this week's rankings image.</p>
  </header>

  <div class="card">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('generate') }}" method="post" enctype="multipart/form-data">
      <label for="csv_file">Schedule CSV File</label>
      <input type="file" id="csv_file" name="csv_file" accept=".csv" required>

      <div class="row">
        <div class="field">
          <label for="div_label">Division</label>
          <input type="text" id="div_label" name="div_label" placeholder="3'S" value="3'S">
        </div>
        <div class="field">
          <label for="week_label">Week</label>
          <input type="text" id="week_label" name="week_label" placeholder="WEEK 1" value="WEEK 1">
        </div>
      </div>

      <button type="submit">Generate Rankings</button>
    </form>
  </div>

  <footer>EHL Power Rankings Generator</footer>
</body>
</html>
